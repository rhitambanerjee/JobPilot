spring:
  jpa:
    show-sql: true
  # Local mail catcher (docker compose up -d mailpit). Read the emails at http://localhost:8025
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

tracker:
  outbox:
    poll-ms: 500
  jobs:
    poll-ms: 500
  stale:
    days: 1
    cron: "0 * * * * *"   # every minute, to see it work during development
  notifications:
    email-poll-ms: 2000
  outgoing:
    poll-ms: 1000
  auth:
    log-emails: true   # prints verification / reset links in the backend log, handy when no mail server is running

logging:
  level:
    com.rhitam.jobtracker: DEBUG
